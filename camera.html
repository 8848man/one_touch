<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원터치 카메라 — 앨범 스와이프 카메라</title>
<style>
:root {
--bg: #0a0a0c;
--panel: #111114;
--accent: #2f7bff;
--accent-glow: rgba(47, 123, 255, 0.55);
--text: #f5f6f8;
--text-dim: #9a9ca4;
--chip: rgba(255,255,255,0.10);
--chip-active: #2f7bff;
--danger: #ff5a5a;
}

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
background: #1b1c20;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
}

.phone {
width: 390px;
height: 800px;
max-height: 94vh;
background: var(--bg);
border-radius: 44px;
position: relative;
overflow: hidden;
box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 10px #0c0c0f, 0 0 0 12px #2a2b30;
display: flex;
flex-direction: column;
}

/* ---------- Camera preview ---------- */
.viewfinder {
position: absolute;
inset: 0;
background:
linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%),
linear-gradient(180deg, #acd4ef 0%, #c7e2f2 38%, #6f93a8 56%, #3f5562 70%, #2b3a44 100%);
overflow: hidden;
}
/* sky clouds */
.cloud { position:absolute; background:rgba(255,255,255,0.7); border-radius:50%; filter: blur(6px); }
.c1 { width:120px; height:34px; top:60px; left:40px; }
.c2 { width:80px; height:26px; top:110px; right:50px; }
/* skyline */
.skyline { position:absolute; bottom:42%; left:0; right:0; height:120px; display:flex; align-items:flex-end; gap:3px; padding:0 18px; opacity:0.92; }
.skyline span { background: linear-gradient(180deg,#7d96a6,#54707f); border-radius:2px 2px 0 0; flex:1; }
/* bridge */
.bridge { position:absolute; bottom:40%; left:0; right:0; height:60px; }
.bridge svg { width:100%; height:100%; }
/* water */
.water { position:absolute; bottom:0; left:0; right:0; height:40%; background: linear-gradient(180deg,#3f5562,#223038); }
.rocks { position:absolute; bottom:0; left:0; right:0; height:90px; background: linear-gradient(180deg, transparent, #14181b); }

/* flash effect */
.flash {
position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50;
}
.flash.fire { animation: flash 0.45s ease-out; }
@keyframes flash { 0%{opacity:0;} 12%{opacity:0.9;} 100%{opacity:0;} }

/* ---------- Top bar ---------- */
.topbar {
position: relative;
z-index: 10;
display: flex;
align-items: center;
justify-content: space-between;
padding: 20px 18px 0;
}
.icon-btn {
width: 46px; height: 46px;
border-radius: 50%;
background: rgba(0,0,0,0.42);
backdrop-filter: blur(8px);
border: none;
display: flex; align-items: center; justify-content: center;
cursor: pointer;
color: var(--text);
transition: transform 0.15s, background 0.15s;
}
.icon-btn:active { transform: scale(0.9); background: rgba(0,0,0,0.6); }
.icon-btn svg { width: 22px; height: 22px; }

.album-pill {
background: rgba(0,0,0,0.42);
backdrop-filter: blur(8px);
color: var(--text);
padding: 11px 18px;
border-radius: 22px;
font-size: 15px;
font-weight: 600;
display: flex; align-items: center; gap: 7px;
letter-spacing: -0.2px;
}
.album-pill svg { width: 16px; height: 16px; opacity: 0.8; }

.spacer { flex: 1; }

/* ---------- Bottom controls ---------- */
.controls {
position: relative;
z-index: 10;
margin-top: auto;
padding: 0 0 26px;
background: linear-gradient(180deg, rgba(10,10,12,0) 0%, rgba(10,10,12,0.82) 38%, rgba(10,10,12,0.96) 100%);
padding-top: 60px;
}

/* ===== NEW: Pin-shaped shutter floating above the album loop ===== */
.shutter-zone {
position: relative;
height: 92px;
display: flex;
align-items: flex-start;
justify-content: center;
pointer-events: none; /* only the pin itself is clickable */
}
.shutter-pin {
pointer-events: auto;
position: relative;
width: 84px;
height: 84px;
cursor: pointer;
filter: drop-shadow(0 10px 18px var(--accent-glow));
transition: transform 0.14s cubic-bezier(.22,.61,.36,1);
z-index: 4;
}
.shutter-pin:active { transform: scale(0.9); }
/* the teardrop / map-pin body */
.shutter-pin .pin-body {
position: absolute;
inset: 0;
width: 84px;
height: 84px;
background: var(--accent);
border-radius: 50% 50% 0 50%;
transform: rotate(45deg);
box-shadow: 0 0 0 5px rgba(47,123,255,0.18);
}
/* camera icon sits upright in the round part of the pin (upper bulge) */
.shutter-pin .pin-icon {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -42%);
width: 40px; height: 40px;
color: #fff;
z-index: 2;
}
.shutter-pin .pin-icon svg { width: 100%; height: 100%; }

/* ===== Album loop: square boxes ===== */
.loop {
display: flex;
align-items: center;
justify-content: center;
gap: 0;
padding: 0 4px 14px;
position: relative;
margin-top: 11px;
}
.arrow {
background: none; border: none; color: var(--text-dim);
cursor: pointer; padding: 6px 4px; flex-shrink: 0;
transition: color 0.15s, transform 0.15s;
}
.arrow:active { transform: scale(0.85); color: var(--text); }
.arrow svg { width: 22px; height: 22px; }

.reel {
flex: 1;
overflow: hidden;
position: relative;
height: 56px;
}
.reel-track {
display: flex;
align-items: center;
height: 100%;
will-change: transform;
}
.album {
flex-shrink: 0;
width: 64px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
cursor: pointer;
user-select: none;
}
/* box removed — show name text only */
.album .disc { display: none; }
.album .name {
font-size: 12px;
color: var(--text-dim);
font-weight: 500;
transition: all 0.25s;
white-space: nowrap;
}
.album.center .name {
color: var(--text);
font-size: 16px;
font-weight: 700;
}
/* distance from center: progressively smaller + fainter */
.album.d1 .name { opacity: 0.8; font-size: 12px; }
.album.d2 .name { opacity: 0.55; font-size: 11px; }
.album.d3 .name { opacity: 0.35; font-size: 10px; }
.album.d4 .name { opacity: 0; }

.shutter-hint {
text-align: center;
color: var(--text-dim);
font-size: 11px;
margin: -2px 0 16px;
letter-spacing: 0.2px;
opacity: 0.7;
}

/* bottom action buttons */
.actions {
display: flex;
justify-content: space-between;
padding: 0 22px;
}
.action-btn {
background: rgba(255,255,255,0.10);
border: 1px solid rgba(255,255,255,0.12);
color: var(--text);
padding: 12px 16px;
border-radius: 16px;
font-size: 13px;
font-weight: 600;
display: flex; align-items: center; gap: 7px;
cursor: pointer;
transition: background 0.15s, transform 0.12s;
letter-spacing: -0.2px;
}
.action-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.18); }
.action-btn svg { width: 17px; height: 17px; }

/* ---------- Modal ---------- */
.overlay {
position: absolute; inset: 0; z-index: 100;
background: rgba(0,0,0,0.55);
backdrop-filter: blur(3px);
display: none;
align-items: center;
justify-content: center;
padding: 28px;
}
.overlay.show { display: flex; }
.modal {
background: var(--panel);
border: 1px solid rgba(255,255,255,0.08);
border-radius: 24px;
width: 100%;
padding: 24px 22px;
color: var(--text);
animation: pop 0.2s ease-out;
}
@keyframes pop { from{transform:scale(0.92);opacity:0;} to{transform:scale(1);opacity:1;} }
.modal h3 { font-size: 17px; margin-bottom: 6px; letter-spacing:-0.3px; }
.modal p { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.5; }
.modal input {
width: 100%;
background: rgba(255,255,255,0.06);
border: 1px solid rgba(255,255,255,0.12);
border-radius: 12px;
padding: 13px 14px;
color: var(--text);
font-size: 15px;
margin-bottom: 18px;
outline: none;
}
.modal input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; }
.btn {
flex: 1;
padding: 13px;
border-radius: 13px;
border: none;
font-size: 14px;
font-weight: 700;
cursor: pointer;
transition: opacity 0.15s, transform 0.12s;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: rgba(255,255,255,0.08); color: var(--text); }
.err-msg { color: var(--danger); font-size: 12px; margin: -10px 0 14px; display:none; }
.err-msg.show { display:block; }

/* manage list */
.manage-list { display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; margin-bottom: 8px; }
.manage-row {
display: flex; align-items: center; gap: 12px;
padding: 12px 6px;
border-bottom: 1px solid rgba(255,255,255,0.06);
}
.manage-row .mname { flex: 1; font-size: 15px; font-weight: 500; }
.manage-row .mname input {
margin: 0; padding: 7px 10px; font-size: 14px; width: 100%;
}
.edit-btn { background:none; border:none; color: var(--accent); font-size:13px; font-weight:600; cursor:pointer; padding:6px; }
/* toggle */
.toggle {
width: 42px; height: 25px;
border-radius: 14px;
background: rgba(255,255,255,0.15);
position: relative; cursor: pointer; flex-shrink:0;
transition: background 0.2s;
}
.toggle.on { background: var(--accent); }
.toggle::after {
content:""; position:absolute; top:3px; left:3px;
width:19px; height:19px; border-radius:50%; background:#fff;
transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(17px); }
.modal-close {
width:100%; margin-top:10px; background: rgba(255,255,255,0.08);
color:var(--text); border:none; padding:13px; border-radius:13px;
font-weight:700; font-size:14px; cursor:pointer;
}

.saved-tag {
position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8);
background:rgba(0,0,0,0.6); color:#fff; padding:10px 18px; border-radius:30px;
font-size:13px; font-weight:600; opacity:0; z-index:60; pointer-events:none;
backdrop-filter: blur(6px);
}
.saved-tag.show { animation: savedPulse 0.7s ease-out; }
@keyframes savedPulse {
0%{opacity:0; transform:translate(-50%,-50%) scale(0.8);}
25%{opacity:1; transform:translate(-50%,-50%) scale(1);}
75%{opacity:1;}
100%{opacity:0; transform:translate(-50%,-50%) scale(1);}
}
</style>
</head>

<script>
// ---- State ----
let albums = [
{ id: 1, name: "업무",   visible: true },
{ id: 2, name: "책",     visible: true },
{ id: 3, name: "부산여행", visible: true },
{ id: 4, name: "아이",   visible: true },
{ id: 5, name: "기록",   visible: true },
];
let nextId = 6;

const ALBUM_W = 64;
const reelTrack = document.getElementById('reelTrack');
const pillName = document.getElementById('pillName');
const savedTag = document.getElementById('savedTag');

function visibleAlbums() { return albums.filter(a => a.visible); }

let pos = 2; // start on 부산여행
const PAD = 4;
let animating = false;

function realIndex(p) {
const n = visibleAlbums().length;
return ((p % n) + n) % n;
}

function applyDistanceClass(el, off) {
el.classList.remove('center', 'd1', 'd2', 'd3', 'd4');
const d = Math.abs(off);
if (d === 0) el.classList.add('center');
else if (d === 1) el.classList.add('d1');
else if (d === 2) el.classList.add('d2');
else if (d === 3) el.classList.add('d3');
else el.classList.add('d4');
}

function layout(animate) {
const vis = visibleAlbums();
if (vis.length === 0) { reelTrack.innerHTML = ''; return; }

```
reelTrack.style.transition = animate
  ? 'transform 0.34s cubic-bezier(.25,.65,.35,1)'
  : 'none';

reelTrack.innerHTML = '';
for (let off = -PAD; off <= PAD; off++) {
  const p = pos + off;
  const album = vis[realIndex(p)];
  const el = document.createElement('div');
  el.className = 'album';
  applyDistanceClass(el, off);
  el.innerHTML = `<div class="disc"></div><div class="name">${album.name}</div>`;
  el.dataset.off = off;
  el.addEventListener('click', () => {
    const o = parseInt(el.dataset.off, 10);
    // tapping the center box no longer shoots; it just stays.
    if (o !== 0) move(o > 0 ? 1 : -1);
  });
  reelTrack.appendChild(el);
}

const reelW = document.querySelector('.reel').clientWidth;
const centerOffset = reelW / 2 - (PAD * ALBUM_W + ALBUM_W / 2);
reelTrack.style.transform = `translateX(${centerOffset}px)`;

const cur = vis[realIndex(pos)];
pillName.textContent = cur.name;
savedTag.textContent = cur.name + "에 저장됨";
```

}

function move(dir) {
const vis = visibleAlbums();
if (vis.length === 0 || animating) return;
animating = true;

```
const reelW = document.querySelector('.reel').clientWidth;
const baseOffset = reelW / 2 - (PAD * ALBUM_W + ALBUM_W / 2);

reelTrack.style.transition = 'transform 0.30s cubic-bezier(.25,.65,.35,1)';
reelTrack.style.transform = `translateX(${baseOffset - dir * ALBUM_W}px)`;

const cards = reelTrack.children;
for (let i = 0; i < cards.length; i++) {
  const off = parseInt(cards[i].dataset.off, 10) - dir;
  applyDistanceClass(cards[i], off);
}

const onEnd = () => {
  reelTrack.removeEventListener('transitionend', onEnd);
  pos += dir;
  layout(false);
  animating = false;
};
reelTrack.addEventListener('transitionend', onEnd);
```

}

function render() { layout(false); }

function shoot() {
const flash = document.getElementById('flash');
flash.classList.remove('fire'); void flash.offsetWidth; flash.classList.add('fire');
savedTag.classList.remove('show'); void savedTag.offsetWidth; savedTag.classList.add('show');
}

// NEW: the pin is the shutter
document.getElementById('shutterPin').addEventListener('click', shoot);

document.getElementById('prevBtn').addEventListener('click', () => move(-1));
document.getElementById('nextBtn').addEventListener('click', () => move(1));

// swipe on reel
let startX = null;
const reel = document.querySelector('.reel');
reel.addEventListener('touchstart', e => startX = e.touches[0].clientX);
reel.addEventListener('touchend', e => {
if (startX === null) return;
const dx = e.changedTouches[0].clientX - startX;
if (Math.abs(dx) > 40) move(dx < 0 ? 1 : -1);
startX = null;
});
let mDown = null;
reel.addEventListener('mousedown', e => mDown = e.clientX);
reel.addEventListener('mouseup', e => {
if (mDown === null) return;
const dx = e.clientX - mDown;
if (Math.abs(dx) > 40) move(dx < 0 ? 1 : -1);
mDown = null;
});

// top icon feedback
let front = false;
document.getElementById('flipBtn').addEventListener('click', function(){
front = !front;
document.querySelector('.viewfinder').style.filter = front ? 'brightness(1.12) saturate(0.85)' : 'none';
});
document.getElementById('settingsBtn').addEventListener('click', () => {});

// ---- New album ----
const newOverlay = document.getElementById('newOverlay');
const newInput = document.getElementById('newAlbumInput');
const newErr = document.getElementById('newErr');
document.getElementById('newBtn').addEventListener('click', () => {
newInput.value=''; newErr.classList.remove('show'); newOverlay.classList.add('show'); newInput.focus();
});
document.getElementById('newCancel').addEventListener('click', () => newOverlay.classList.remove('show'));
document.getElementById('newCreate').addEventListener('click', () => {
const name = newInput.value.trim();
if (!name) return;
if (albums.some(a => a.name === name)) { newErr.classList.add('show'); return; }
albums.push({ id: nextId++, name, visible: true });
newOverlay.classList.remove('show');
pos = visibleAlbums().length - 1;
render();
});

// ---- Manage ----
const manageOverlay = document.getElementById('manageOverlay');
const manageList = document.getElementById('manageList');
function renderManage() {
manageList.innerHTML = '';
albums.forEach(a => {
const row = document.createElement('div');
row.className = 'manage-row';
row.innerHTML =          `<div class="mname"><span class="mtext">${a.name}</span></div>         <button class="edit-btn">수정</button>         <div class="toggle ${a.visible?'on':''}"></div>`;
const toggle = row.querySelector('.toggle');
toggle.addEventListener('click', () => {
a.visible = !a.visible;
toggle.classList.toggle('on');
render();
});
const editBtn = row.querySelector('.edit-btn');
const mname = row.querySelector('.mname');
editBtn.addEventListener('click', () => {
if (editBtn.textContent === '수정') {
mname.innerHTML = `<input value="${a.name}" maxlength="20"/>`;
editBtn.textContent = '저장';
mname.querySelector('input').focus();
} else {
const v = mname.querySelector('input').value.trim();
if (v) a.name = v;
mname.innerHTML = `<span class="mtext">${a.name}</span>`;
editBtn.textContent = '수정';
render();
}
});
manageList.appendChild(row);
});
}
document.getElementById('manageBtn').addEventListener('click', () => { renderManage(); manageOverlay.classList.add('show'); });
document.getElementById('manageClose').addEventListener('click', () => manageOverlay.classList.remove('show'));

[newOverlay, manageOverlay].forEach(ov => ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('show'); }));

// build skyline buildings
const sky = document.getElementById('skyline');
const heights = [40,70,55,90,65,110,80,120,95,75,100,60,85,50,70];
heights.forEach(h => { const s=document.createElement('span'); s.style.height=h+'px'; sky.appendChild(s); });

window.addEventListener('load', render);
setTimeout(render, 50);
</script>
</body>
